{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>OTT Retention Risk Prediction</title>
    <style>
        body{
            font-family: Arial;
            background-image: url("{% static 'ott2.jpg' %}");
            background-size: cover;
            padding: 40px;
        }

        form{
            backdrop-filter: blur(10px);
            padding: 20px;
            width: 430px;
            margin: auto;
            border-radius: 8px;
            margin-top: 50px;
            border: 2px solid black;
        }

        input{
            width: 90%;
            margin-top: 10px;
            margin-left: 15px;
            padding: 8px;
            border-radius: 13px;
            border: 1px solid black;
            transition: 0.3s ease-in-out;
        }

        input:hover{
            padding: 13px;
        }

        input:hover::placeholder{
            font-size: 10px;
            transition-duration: 0.3s;
        }

        button{
            width: 70%;
            margin-left: 34px;
            margin-top: 20px;
            padding: 8px;
            border-radius: 13px;
            background-color: black;
            color: white;
            border: none;
            margin-left: 60px;
            transition: 0.3s ease-in-out;
        }

        button:hover{
            padding: 13px;
        }


        h2{
            text-align: center;
        }

        .result{
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            color: white;
        }
    </style>
</head>

<body>

<form method="POST">
    {% csrf_token %}
    <h2>Retention Risk Predictor</h2>

    <input type="number" name="episode_duration_min" placeholder="Episode Duration" required>
    <input type="number" name="pacing_score" placeholder="Pacing Score (1 – 5)" required>
    <input type="number" name="hook_strength" placeholder="Hook Strength (1–5)" required>
    <input type="number" step="0.1" name="avg_watch_percentage" placeholder="Avg Watch Percentage" required>
    <input type="number" name="pause_count" placeholder="Pause Count" required>
    <input type="number" name="rewind_count" placeholder="Rewind Count" required>

    <input type="number" name="skip_intro" placeholder="Skip Intro (0 = No, 1 = Yes)" required>

    <input type="number" name="cognitive_load" placeholder="Cognitive Load" required>
    <input type="number" name="drop_off_probability" placeholder="Drop-off Probability" required>

    <button type="submit">Predict</button>

    {% if prediction %}
    <div class="result">
        Retention Risk: {{ prediction }}
    </div>
    {% endif %}
</form>

</body>
</html>
